name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Mypy Type Check
        run: |
          mypy src

      - name: Run Pytest under xdist (parallel-safety check)
        run: |
          pytest -n auto -v

      - name: Run Pytest with coverage gate
        run: |
          coverage run --source=src -m pytest -v
          coverage report -m

  min-deps:
    # Verifies the floor versions declared in pyproject.toml actually resolve and
    # pass -- pinning everything to >= doesn't catch floors that are mutually
    # incompatible (e.g. fastapi>=0.100.0 excludes pydantic==2.0.0/2.0.1) or too
    # low for what the code actually uses (e.g. asyncio_default_fixture_loop_scope
    # needs pytest-asyncio>=0.24, which needs pytest>=8.2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10 (the declared floor)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies pinned to their declared floors
        run: |
          python -m pip install --upgrade pip
          pip install \
            "httpx==0.25.0" "pytest==8.2.0" \
            "pytest-asyncio==0.24.0" "pytest-cov==4.1.0" "pytest-xdist==3.5.0" "hypothesis==6.100.0" \
            "mypy==1.5.0" "ruff==0.1.0" \
            "fastapi==0.100.0" "uvicorn==0.20.0" \
            "langchain-core==0.3.0" "langgraph==0.2.20" "langchain-openai==0.2.0" "openai==1.40.0" \
            -e .

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Mypy Type Check
        run: mypy src

      - name: Run Pytest
        run: pytest -v
